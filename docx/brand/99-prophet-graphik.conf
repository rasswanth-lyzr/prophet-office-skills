<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- QA rendering only. When Graphik is not installed, LibreOffice falls back to a serif.
     These rules render Graphik with Arial/Liberation Sans instead (Graphik runs 1-8% wider
     than Arial, so keep ~10% slack in text boxes). Ignored when real Graphik is present. -->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>Graphik Light</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Graphik</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Graphik Medium</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Graphik Semibold</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
